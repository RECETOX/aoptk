name: Python package

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:

  build:
    name: Build for (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      CERIT_API_KEY: ${{ secrets.CERIT_API_KEY }}
      CI: True
    strategy:
      fail-fast: true
      matrix:
        os: ['ubuntu-latest', 'windows-latest']
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.0.0
      - name: Python info
        shell: bash -e {0}
        run: |
          which python
          python --version
      - name: Install dependencies with uv
        run: |
          uv lock
          uv sync --frozen --extra dev --extra publishing --extra zotero
      - name: Run unit tests
        run: uv run python -m pytest -m "not openai" -v
      - name: Run OpenAI unit tests
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: uv run python -m pytest -m "openai" -v
      - name: Verify that we can build the package
        run: uv run python -m build

  lint:
    name: Linting build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.0.0
      - name: Python info
        shell: bash -e {0}
        run: |
          which python
          python --version
      - name: Install dependencies with uv
        run: |
          uv lock
          uv sync --frozen --extra dev
      - name: Check style against standards using ruff
        run: |
          uv run ruff check
          uv run ruff format --check

  type_checker:
    name: Type checking build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.0.0
      - name: Python info
        shell: bash -e {0}
        run: |
          which python
          python --version
      - name: Install dependencies with uv
        run: |
          uv lock
          uv sync --frozen --extra dev
      - name: Check types using mypy
        run: uv run mypy src/aoptk tests --show-error-codes --pretty
